name: CI

on:
  push:
    branches: [ main, vibes ]
  # No branch filter: every pull request runs CI, whatever it targets. Filtering
  # on `main` meant no PR into `vibes` was ever tested, and it would also skip a
  # stacked PR that targets a feature branch.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build -p words-to-data --lib --verbose

    - name: Unzip test files
      run: cd tests/test_data && tar xvf test_files.tar.xz

    - name: Run Rust tests
      run: cargo test -p words-to-data --verbose
