name: Release binaries

# Builds the `words_to_data` command for each platform below. On a `v*` tag it
# attaches the archives to that tag's GitHub release, so a user can download the
# command with curl and needs no Rust toolchain. A manual run, or a pull request
# that changes this file, builds them and keeps them as workflow artifacts only.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release_binaries.yaml
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl gives one static executable that runs on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite builds SQLite from C source, so a musl build needs a musl C compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin words_to_data

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name=words_to_data-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release words_to_data
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "words_to_data-${{ matrix.target }}"
          Compress-Archive -Path target/${{ matrix.target }}/release/words_to_data.exe -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release may not exist yet when the tag is pushed; create it then.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
