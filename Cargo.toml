[workspace]
members = ["."]
resolver = "2"

[package]
name = "words-to-data"
version = "0.3.0"
edition = "2024"
exclude = ["tests/"]
description = "Convert Legal Documents Into Diffable Data Structures"
repository = "https://github.com/Scronkfinkle/words-to-data"
license = "MIT OR Apache-2.0"

[lib]
name = "words_to_data"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
rayon = "1.11.0"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.148"
similar = "2.7.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["serde", "formatting", "parsing"] }
rusqlite = { version = "0.35", features = ["bundled", "serialize"] }
sha2 = "0.11.0"
hex = "0.4.3"
regex = "1.12.3"
serde_with = "3.18.0"
ureq = "3"
dirs = "6.0.0"
clap = { version = "4.6.6", features = ["derive"], optional = true }
zip = { version = "2", optional = true }

[features]
default = ["tools"]
# Mirror downloader: fetch the manifest + release-point zips from our host.
download = ["zip"]
tools = ["clap", "download"]

# Single user-facing binary; every tool is a subcommand (`words_to_data <cmd>`).
# Gated so a pure-lib consumer (`default-features = false`) skips clap + this bin.
[[bin]]
name = "words_to_data"
path = "src/bin/words_to_data/main.rs"
required-features = ["tools"]

[dev-dependencies]
rstest = "0.18"
# Tests forge a dataset written by an older build, which needs raw SQL: the
# public API can only produce files this build considers current.
rusqlite = { version = "0.35", features = ["bundled", "serialize"] }
